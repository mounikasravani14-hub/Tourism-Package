name: Visit with Us Tourism CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- JOB 1: Register Dataset ----------
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tourism_project/deployment/requirements.txt

      - name: Register dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-tourism-data
          path: tourism_project/data/tourism.csv

  # ---------- JOB 2: Data Preparation ----------
  data-preparation:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tourism_project/deployment/requirements.txt

      - name: Download registered dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-tourism-data
          path: tourism_project/data

      - name: Prepare data
        run: python tourism_project/model_building/prep.py

      
      - name: Upload train/test splits
        uses: actions/upload-artifact@v4
        with:
          name: tourism-data-splits
          path: tourism_project/data/prepared/
          if-no-files-found: error


  # ---------- JOB 3: Model Training + MLflow Tracking ----------
  model-training:
    name: Model Training
    needs: data-preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r tourism_project/deployment/requirements.txt
          pip install mlflow==3.0.1

      
      - name: Download train/test splits
        uses: actions/download-artifact@v4
        with:
          name: tourism-data-splits
          path: tourism_project/data/prepared/


      - name: Start MLflow tracking server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 > mlflow.log 2>&1 &
          sleep 5

      - name: Train model with MLflow tracking
        run: python tourism_project/model_building/train.py

      
      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/best_model.joblib

          if git diff --cached --quiet; then
            echo "No model changes to commit"
            exit 0
          fi

          git commit -m "Add trained tourism prediction model [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main


